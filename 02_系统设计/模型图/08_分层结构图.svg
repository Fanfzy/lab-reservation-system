<text x="500.0" y="217.5" font-family="Microsoft YaHei" font-size="23" text-anchor="middle" fill="#17365D">urls路由、views视图、forms表单、登录会话</text><!-- 当前图形元素。 -->
<rect x="70" y="285" width="860" height="85" rx="0" fill="#F5F9FD" stroke="#2F75B5" stroke-width="1.5"/><!-- 当前图形元素。 -->
<text x="500.0" y="322.5" font-family="Microsoft YaHei" font-size="24" text-anchor="middle" fill="#17365D" font-weight="600">业务服务层</text><!-- 当前图形元素。 -->
<text x="500.0" y="352.5" font-family="Microsoft YaHei" font-size="23" text-anchor="middle" fill="#17365D">reservations预约，labs资源，accounts账号，reports统计</text><!-- 当前图形元素。 -->
<rect x="70" y="420" width="860" height="85" rx="0" fill="#F5F9FD" stroke="#2F75B5" stroke-width="1.5"/><!-- 当前图形元素。 -->
<text x="500.0" y="457.5" font-family="Microsoft YaHei" font-size="24" text-anchor="middle" fill="#17365D" font-weight="600">数据模型层</text><!-- 当前图形元素。 -->
<text x="500.0" y="487.5" font-family="Microsoft YaHei" font-size="23" text-anchor="middle" fill="#17365D">User、Lab、Reservation、ReviewRecord、AuditEvent</text><!-- 当前图形元素。 -->
<rect x="70" y="555" width="860" height="85" rx="0" fill="#F5F9FD" stroke="#2F75B5" stroke-width="1.5"/><!-- 当前图形元素。 -->
