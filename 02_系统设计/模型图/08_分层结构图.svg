<polyline points="500,370 500,420" fill="none" stroke="#2F75B5" stroke-width="1.7" marker-end="url(#arrow)"/><!-- 当前图形元素。 -->
<polyline points="500,505 500,555" fill="none" stroke="#2F75B5" stroke-width="1.7" marker-end="url(#arrow)"/><!-- 当前图形元素。 -->
<rect x="70" y="15" width="860" height="85" rx="0" fill="#D9EAF7" stroke="#2F75B5" stroke-width="1.5"/><!-- 当前图形元素。 -->
<text x="500.0" y="52.5" font-family="Microsoft YaHei" font-size="24" text-anchor="middle" fill="#17365D" font-weight="600">浏览器界面</text><!-- 当前图形元素。 -->
<text x="500.0" y="82.5" font-family="Microsoft YaHei" font-size="23" text-anchor="middle" fill="#17365D">HTML表单与列表，CSS布局，JavaScript即时提示</text><!-- 当前图形元素。 -->
