<text x="500.0" y="622.5" font-family="Microsoft YaHei" font-size="23" text-anchor="middle" fill="#17365D">runtime/db.sqlite3：保存账号及业务记录</text><!-- 当前图形元素。 -->
<text x="594" y="129" font-family="Microsoft YaHei" font-size="22" text-anchor="middle" fill="#17365D">发送请求</text><!-- 当前图形元素。 -->
<text x="594" y="264" font-family="Microsoft YaHei" font-size="22" text-anchor="middle" fill="#17365D">调用业务接口</text><!-- 当前图形元素。 -->
