<rect width="100%" height="100%" fill="white"/><!-- 当前图形元素。 -->
<text x="20" y="31" font-family="Microsoft YaHei" font-size="28" text-anchor="start" fill="#17365D" font-weight="600">分层结构图</text><!-- 当前图形元素。 -->
<text x="20" y="62" font-family="Microsoft YaHei" font-size="20" text-anchor="start" fill="#17365D">界面、请求、业务与数据的职责</text><!-- 当前图形元素。 -->
<g transform="translate(0,80)"><!-- 当前图形元素。 -->
