</g><!-- 当前图形元素。 -->
<text x="20" y="828" font-family="Microsoft YaHei" font-size="19" text-anchor="start" fill="#17365D">框：程序职责；箭头：调用方向。每层通过清晰接口与相邻层协作。</text><!-- 当前图形元素。 -->
