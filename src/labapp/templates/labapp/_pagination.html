{% if page.paginator.num_pages > 1 %} {# 多页时才显示分页入口。 #}
<div class="pagination">{% if page.has_previous %}<a href="?{{ query_string }}&page={{ page.previous_page_number }}">← 上一页</a>{% endif %}<span>第 {{ page.number }} / {{ page.paginator.num_pages }} 页</span>{% if page.has_next %}<a href="?{{ query_string }}&page={{ page.next_page_number }}">下一页 →</a>{% endif %}</div> <!-- 保留筛选条件并更新页码。 -->
{% endif %} {# 分页组件结束。 #}
